{{define "login.html"}}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{.Titulo}}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛡️</text></svg>">
</head>
<body>
  <div class="tela-login">
    <form class="caixa-login" id="form-login">
      <h1><span class="marca">⚔</span> {{.Titulo}}</h1>
      <p class="sub">Entre para ver o painel do servidor.</p>

      <div class="aviso erro" id="aviso-login" hidden></div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>

      <div class="acoes">
        <button type="submit" class="primario">Entrar</button>
      </div>
    </form>
  </div>

  <script src="/static/comum.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>{{end}}
